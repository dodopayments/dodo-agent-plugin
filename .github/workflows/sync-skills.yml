name: Sync skills from upstream

# skills/ is vendored as real files (not a submodule) so that a plain
# `git clone` yields a working plugin. This job keeps the vendored copy fresh
# and makes staleness visible as an open PR instead of invisible drift.
on:
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Fetch upstream skills
              id: upstream
              run: |
                  repo=$(jq -r '.repository' .skills-source.json)
                  branch=$(jq -r '.branch' .skills-source.json)
                  subdir=$(jq -r '.path' .skills-source.json)
                  git clone --depth 1 --branch "$branch" "$repo" /tmp/upstream
                  sha=$(git -C /tmp/upstream rev-parse HEAD)
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"
                  echo "subdir=$subdir" >> "$GITHUB_OUTPUT"

            - name: Apply vendoring transforms
              env:
                  UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
                  SUBDIR: ${{ steps.upstream.outputs.subdir }}
              run: |
                  set -euo pipefail
                  rm -rf skills && mkdir -p skills
                  cp -RL "/tmp/upstream/${SUBDIR}/." skills/

                  # Replay every declared transform so the vendored tree is a
                  # deterministic function of upstream, never a manual edit.
                  jq -c '.transforms[]? | select(.type == "rename")' .skills-source.json |
                    while read -r t; do
                      from=$(echo "$t" | jq -r '.from')
                      to=$(echo "$t" | jq -r '.to')
                      if [ -d "skills/$from" ]; then
                        mv "skills/$from" "skills/$to"
                        echo "renamed $from -> $to"
                      fi
                    done

                  # --indent 4 matches the repo's formatting. jq defaults to 2,
                  # which would rewrite the whole file on every run and open a
                  # pure-whitespace PR each week even when nothing changed.
                  tmp=$(mktemp)
                  jq --indent 4 --arg sha "$UPSTREAM_SHA" --arg date "$(date -u +%Y-%m-%d)" \
                     '.commit = $sha | .syncedAt = $date' .skills-source.json > "$tmp"
                  mv "$tmp" .skills-source.json

            # The declared skill set must track upstream, otherwise conformance
            # fails on exactly the change worth reviewing (an added or removed
            # skill) and no PR is ever opened. Drift shows up as a diff here.
            - name: Refresh the declared skill set
              run: |
                  set -euo pipefail
                  tmp=$(mktemp)
                  jq --indent 4 --argjson s "$(ls skills | jq -R . | jq -s .)" \
                     '.skills = $s' .skills-source.json > "$tmp"
                  mv "$tmp" .skills-source.json
                  jq -r '"declared skills: \(.skills | length)"' .skills-source.json

            - name: Rebuild generated artifacts
              run: node scripts/build.mjs

            - name: Verify conformance before proposing the change
              run: node scripts/conformance.mjs

            - name: Open a pull request
              uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
              with:
                  # A PAT (or App token) is required: pull requests opened with the
                  # default GITHUB_TOKEN do not trigger `pull_request` workflows, and
                  # skills/ changes almost exclusively arrive through this job - the
                  # PRs that most need the Verify gate. Falls back to GITHUB_TOKEN so
                  # the sync still runs unattended if the secret is absent.
                  token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
                  branch: chore/sync-skills
                  title: "chore: sync skills from upstream"
                  body: |
                      Automated sync of `skills/` from the upstream skills repository.

                      Upstream commit: `${{ steps.upstream.outputs.sha }}`

                      Declared transforms in `.skills-source.json` were replayed, the
                      declared skill set was refreshed, and `scripts/conformance.mjs`
                      passed before this PR was opened.

                      Review the `.skills-source.json` `skills` diff: any addition or
                      removal there is a real upstream change, not drift.
                  commit-message: "chore: sync skills from upstream"
                  delete-branch: true
